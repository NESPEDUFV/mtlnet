[project]
name = "mtlcheck"
version = "0.1.0"
description = "Multi-task POI prediction (next-category + next-region) over a Check2HGI check-in substrate — the v18 system, rebuilt."
# ── AMBIENTE ─────────────────────────────────────────────────────────────────────────────────────
#
# ⚠ Decidido em 2026-08-19, e a razão importa. Até essa data o `pyproject` pedia `pandas>=2.2` e o
# `uv.lock` entregava **3.0.5 com Python 3.14** — uma pilha que NUNCA produziu número nenhum deste
# projeto. Toda a ciência rodou no A40, sob Python 3.12 / pandas 2.2.3 / numpy 2.0.2. Ou seja:
# `uv sync` dava um ambiente que nenhum artefato bancado conhece.
#
# Isso não era teórico. O bump de pandas 3 entrou sem ninguém rodar a suíte contra ele e carregou
# por um dia um `TypeError` que **travava todo build de substrato** (`np.issubdtype` sobre
# `StringDtype`), mais duas falhas de teste.
#
# O TETO existe para reprodutibilidade: os números da dissertação têm de sair de um ambiente que
# `uv sync` recria. O PISO é o que roda hoje no A40.
#
# `scikit-learn` é a exceção deliberada e ficou SEM teto: verificado em 19-08 que os cinco hashes de
# fold são idênticos entre 1.8 e 1.9 sobre os mesmos dados, então a versão não é parâmetro
# científico — e o 1.9 recusa um `StratifiedGroupKFold` cujo `n_splits` excede a contagem de grupos,
# que o 1.8 aceitava em silêncio. Essa recusa achou uma fixture degenerada e vale manter.
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.11",
    "numpy>=1.26,<2.5",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scikit-learn>=1.8",        # sem teto: não muda a partição, e o 1.9 recusa splits degenerados
    "torchmetrics>=1.4",
    # Layer 1. Both were imported without being declared, so `uv sync` produced a package whose
    # entire substrate layer could not import — it worked only on machines that happened to have
    # them from the old repo's environment.
    "torch-geometric>=2.5",     # substrate/encoders.py: GCNConv, scatter, softmax
    "geopandas>=1.0",           # substrate/regions.py: the census-tract spatial join
    "scipy>=1.13",              # the Delaunay place graph (substrate/spatial.py)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mtlcheck = "mtlcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtlcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works from a bare checkout without an editable install.
pythonpath = ["src"]
# Equivalence tests need the OLD implementation importable (it lives two levels up in the
# worktree). Marked so they can be deselected on a machine that only has the new package.
markers = [
    "equivalence: compares against the reference v18 implementation in the old repo",
    "gpu: requires CUDA",
    "artifacts: requires substrate artifacts on disk",
]
