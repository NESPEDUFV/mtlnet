# O triângulo: reg lendo os embeddings de região do PRÓPRIO v18 em vez do v14.
#
# ── RETROFIT ────────────────────────────────────────────────────────────────────────────────────
# Escrito em 2026-08-19 DEPOIS das células terem rodado, a partir de drivers de shell ad-hoc que
# viviam fora do repo. Isso é dívida sendo paga, não o processo correto — ver
# `docs/RUNNING_STUDIES.md`. Um manifesto retroativo só vale se `mtlcheck wave status` reconhecer as
# células bancadas como válidas; se não reconhecer, ele descreve outro experimento.
#
# ⚠ O SUBSTRATO NÃO CABE AQUI. Uma wave é uma matriz de células de TREINO; a identidade do substrato
# não é campo de célula (`docs/RUNNING_STUDIES.md` §4). Estes estudos diferem **exatamente** nisso,
# então a identidade de cada um está em `evidence/campaign_substrates.json` e repetida abaixo.
#
# substrato lido: a9e1dfb26413a42a — o mesmo de al_full; só a FONTE dos embeddings de região muda
# ────────────────────────────────────────────────────────────────────────────────────────────────

[wave]
study = "tri_v18region"

[substrate]
# Declarado, não construído: a wave recusa rodar sobre outro substrato.
recipe = "recipes/v19/substrate.toml"
[substrate.identity]
checkin = "a9e1dfb26413a42a"
region = "93390a37a5907524"

[[cell]]
recipe = "recipes/v18/reg.toml"
states = ["alabama"]
seeds = [0]
split_seed = 0
set = { inner_validation = true, region_engine = "check2hgi_v18" }
